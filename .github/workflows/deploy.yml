name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - copilot/redesign-legacy-website
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets into JS
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FORM_RECIPIENT: ${{ secrets.FORM_RECIPIENT }}
        run: |
          sed -i "s|__RESEND_API_KEY__|${RESEND_API_KEY}|g" js/main.js
          sed -i "s|__FORM_RECIPIENT__|${FORM_RECIPIENT}|g" js/main.js
          echo "Secrets injected."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
